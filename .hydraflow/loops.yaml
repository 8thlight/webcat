- id: prices_sync
  owner: vp-eng
  persona: vp-eng
  enabled: true
  runs_locally: false
  every: nightly
  execution:
    mode: workflow
    path: .github/workflows/prices-sync.yml
    job: sync
  cares_for: what a token costs
  arrives: M2
  note: 'Pulls model rates from LiteLLM into the pinned lock and opens a PR when one moves. A loop rather than an effect because nothing in the factory can trigger it: the rate changes on somebody else''s
    server, and no merge, gate or label in this repo knows it happened. Opens a PR rather than committing, because a rate change is a change to what every ledger row in the system believes.'
  files: one open PR per prices.lock.json diff; a rate move while a PR is still open updates that PR rather than opening a second
  finding_budget:
    per_day: 1
