    - docs/standards/proxy_is_the_only_path
    - docs/standards/fail_closed
    - docs/standards/decision_seam
    weighs:
    - findings and escapes in the assurance chamber's reports
    - refusals by name in the chambers' reports
  - area: delivery flow
    reads:
    - docs/standards/dark_factory
    - docs/standards/overflow_is_declared
    - docs/standards/defect_route
    - docs/standards/artifact_chain
    - stages/merge.yaml
    - stages/ship.yaml
    - agents/council/flow.md
    weighs:
    - land time
