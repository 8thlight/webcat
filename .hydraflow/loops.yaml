  - area: docs and knowledge
    reads:
    - docs/standards/knowledge
    - docs/standards/no_second_copy
    - docs/standards/ubiquitous_language
    - docs/standards/adr_enforcement
    - docs/adr
    - agents/editor.md
    weighs:
    - notes filed and left in the vault's inbox
    - findings in the assurance chamber's reports
  grounding_review:
    month: 1
    chamber: spec
  finding_budget:
    per_day: 1
- id: council
  owner: vp-eng
  persona: plant-manager
  enabled: true
  runs_locally: false
  kill_switch: true
  every: 1h
  execution:
    mode: fleet
  cares_for: every chamber .hydraflow/council.yaml declares, convened on what its triggers name and on what a loop hands it, each decision and its moves on queued work recorded and posted with the operator's
    veto
  arrives: M10
  files: none — observes only, and files no finding; it commits each convening's decision record under agents/council/decisions/ and posts it to the operator with a veto; a chamber's moves close, defer,
    raise one rung or reorder existing work, each rolled back by a veto; and inside a grant (a chamber's prints key, bead hydraflow-p15yo.3) it writes the record plus one order in infra.chamber_orders,
    which the work-orders ingest files, never this loop
- id: work-orders
  owner: plant-manager
  persona: plant-manager
  enabled: true
  runs_locally: false
  every: 5m
  execution:
    mode: process
    host_job: scripts/ingest_builder_job.sh
    path: src/printer/factory_ingest/work_orders.py
    caller: _run
    call: main
    cadence_symbol: CADENCE_SECONDS
  cares_for: every open order in infra.work_orders and infra.chamber_orders, each filed once as a bead, a chamber's only once the council record that approves it is verified; and every learning-proposal
    note in the declared vault's inbox the proposal door reads, filed once as a labelled queue bead (R68)
  arrives: M12
  files: one bead per open order and one per learning proposal note, deduped by its tag ([WO-<id>] for the plant manager's, [CO-<id>] for a council chamber's, [LP-<created> <note>] for a proposal note)
    and by its own filed-record stream under agents/factory-ingest/
  finding_budget:
    per_day: 3
- id: sensor_bugsink
  owner: product-manager
  persona: product-manager
  enabled: true
  runs_locally: true
  every: 15m
  cares_for: Bugsink signatures and bug reports becoming drafted intents
  arrives: M16
  files: one intent per Bugsink or bug-report signature, re-filed only when that signature's open intent is closed
  recurrence:
    window: 24h
    at_least: 3
  finding_budget:
    per_day: 20
- id: sensor_intake
  owner: product-manager
  persona: product-manager
  enabled: true
  runs_locally: false
  every: 15m
  cares_for: halt signatures the ledger has recorded before becoming filed defects
  arrives: M16
  files: one intent per distinct halt signature, re-filed only when that signature's open intent is closed
  recurrence:
    window: 24h
    at_least: 3
  finding_budget:
    per_day: 20
- id: intake_planner
  owner: product-manager
  persona: product-manager
  enabled: true
  runs_locally: false
  every: 15m
  execution:
    mode: fleet
  cares_for: drafted prints, classified, ranked with evidence, ordered and admitted at the rate the line lands
  arrives: M8
  files: none — observes only; it labels and comments on the drafted print a proposal is about, and files no intent
- id: source_intake
  owner: product-manager
  persona: product-manager
  enabled: true
  every: 2m
  local_every: 15s
  execution:
    mode: fleet
  cares_for: 'every source a line declares, each item one bead in the line''s Inbox: each .md of a markdown folder, changed while it waits, each Jira issue, and each open GitHub issue, told when its print
    opens and lands; released when the source''s rule matches'
  arrives: M10
  files: none — observes only, and files no finding; it takes each item of a declared source into the line's Inbox as one bead keyed by its external_ref (md:<path>, the Jira key, gh-N or the issue's address),
    never a second for one item, and comments on or closes a GitHub issue as its print opens and lands
- id: print_steward
  owner: product-manager
  persona: product-manager
  enabled: true
  every: 15m
  cares_for: open prints that are not approved work, finished prints whose issue or pull request is still open, open prints whose branch already merged, and open prints opened past their ask's abandonment
    hold
  arrives: M8
  note: 'It parks (pauses with the reason not_approved, never ends) an open print on the chain that carries neither the approval label nor a P0 label and has no approval row, never one a live printer has
    a stage of in flight; and it files that print''s work as a finding naming the exact way back in. When an approval lands for a print it parked, it resumes that print where it stopped through printer
    resume''s own act (bead hydraflow-10k1n). It closes the issue of a print already at a terminal state, citing the state. It files an open signed print still before merged whose work branch the forge
    has already merged into the line''s integration branch (bead hydraflow-wrgzl), and acts on it no further: whether a print landed and moves on is the tick''s, and it opens no print. It files an open
    print whose triage carries an abandonment count at or past fail_forward.ask_abandonments_max, an ask opened past its hold (bead hydraflow-f5fg6), and acts on it no further.'
  files: one finding per open print opened past its ask's abandonment hold (keyed by the issue number, bead hydraflow-f5fg6), named again every pass while it stays open carrying that count; one finding
    per print it parks (keyed by the print's issue number), named again every pass until the print is approved and resumed, or a person closes it; one finding per open print whose branch already merged
    while its label is before merged (keyed by the issue number), named again every pass while that holds; one finding per open pull request from a work branch whose print is at a terminal state it does
    not close the pull request for (keyed by the pull request's number, bead hydraflow-k825k), named again every pass while it stays open; it opens no print
  finding_budget:
    per_day: 20
- id: bead_sync
  owner: supervisor
  persona: supervisor
  enabled: true
  every: 15m
  local_every: 5m
  execution:
    mode: fleet
  cares_for: the printer's own bead store and every registered clone's, each pulled from and pushed to its declared remote; on a local instance every registered line's own store, each with its own origin
  arrives: M10
  files: none — observes only; it syncs, pages a store it cannot sync, and reports
- id: record_commit
  runs_locally: false
  owner: plant-engineer
  persona: supervisor
  enabled: true
  every: 1h
  execution:
    mode: fleet
  cares_for: the record files the printer home holds under agents/ that the integration branch's tip does not, carried into one pull request at a time
  arrives: M10
  files: none — observes only, and files no finding; it opens one records pull request when the home's record files differ from the tip, and none while that one is open
- id: console_reading
  owner: staff-designer
  persona: staff-designer
  enabled: true
  runs_locally: false
  every: 30m
  execution:
    mode: fleet
  readings_per_day: 6
  model: claude-opus-5-5
  cares_for: open pull requests into the line whose mapped console screens changed after the staff-designer's recorded reading
  arrives: M10
  files: none — observes only; it reads a stale head, pushes the reading to its branch, and reports per branch what it read, passed over or could not read
- id: refiner
  runs_locally: true
  owner: product-manager
  persona: product-manager
  enabled: true
  kill_switch: true
  every: 5m
  stage_file: stages/refiner.yaml
  finding_feed:
    parent: hydraflow-44nxu
  cares_for: an approved queue below its declared depth, and approved beads with no triage the door accepts
  arrives: M8
  note: It opens prints only through the door (printer.front_door_wiring.open_print), on a triage the door's own rule has already passed, and only for a bead the operator's recorded standing ask covers
    (printer.standing_ask) or one at P0. It never writes the approval label and never approves its own finding. A refused draft is rewritten with the refusal, up to intake.refinement.drafts times; what
    it still cannot refine goes to the fail-forward skill at the intake site first (printer.fail_forward_seat), and waits for the operator, paged by name, only when the skill asks or cannot answer. A queue
    it cannot refill waits the same way.
  files: one finding per approved bead it cannot refine (keyed by the bead id), named again every pass until the bead refines or changes; one approved finding labelled fast-follower per remainder a first
    slice the fail-forward skill delivered leaves; the prints it opens go through the door, one per bead, and only while that bead has no live print; and one finding per batch of urgent follow-ups it cuts,
    keyed by the batch's seed
  follow_up_batches:
    stage_file: stages/follow_up_batcher.yaml
  finding_budget:
    per_day: 10
  runs_while_muted: true
- id: language_caretaker
  runs_locally: false
  owner: editor
  persona: editor
