  - ANTHROPIC_BASE_URL
  - OPENAI_BASE_URL
  - CLAUDE_CONFIG_DIR
  - PATH
  - TERM
  - LANG
  - TZ
  limits:
    memory: 4g
    memory_swap: 6g
    cpus: 2
  allowed_tools:
  - Agent
  - Bash
  - Edit
  - Glob
  - Grep
  - Read
  - WebFetch
  - WebSearch
  - Write
  harness_sandbox:
    codex:
      container: danger-full-access
      host: danger-full-access
    claude:
      container: disabled
      host: disabled
upstreams:
  oauth:
    credential: CLAUDE_CODE_OAUTH_TOKEN
    protocol: anthropic-messages
  api_key:
    credential: ANTHROPIC_API_KEY
    protocol: anthropic-messages
  zai:
    credential: ZAI_API_KEY
    credential_presentation: bearer
    protocol: anthropic-messages
    base_url: https://api.z.ai/api/anthropic
    billing: subscription
    probe: none
  openai_api:
    credential: OPENAI_API_KEY
    protocol: openai-responses
    base_url: https://api.openai.com/v1
  codex_subscription:
    auth_file: /run/hydraflow/codex/auth.json
    protocol: openai-responses
    base_url: https://chatgpt.com/backend-api/codex
    probe: none
  deepseek:
    credential: DEEPSEEK_API_KEY
    protocol: openai-responses
    base_url: https://api.deepseek.com
    billing: metered
    responses_compatibility: deepseek-responses
    review_model:
      priced: deepseek-v4-pro
      wire: deepseek-v4-pro
      family: deepseek
      max_output_tokens: 8192
  kimi:
    credential: KIMI_API_KEY
    protocol: openai-responses
    base_url: https://api.moonshot.ai/v1
    billing: metered
    responses_compatibility: kimi-responses
    review_model:
      priced: moonshot/kimi-k3
      wire: kimi-k3
      family: moonshot
      max_output_tokens: 8192
  lanes:
    interactive:
      anthropic-messages: oauth
      openai-responses: codex_subscription
    worker:
      anthropic-messages: oauth
      openai-responses: codex_subscription
    review:
      anthropic-messages: oauth
      openai-responses: codex_subscription
    plant-manager:
      anthropic-messages: oauth
    plant-engineer:
      anthropic-messages: oauth
    council:
      anthropic-messages: oauth
      openai-responses: codex_subscription
provider_fallbacks: {}
credentials:
  at_most: 3
  store: ~/.hydraflow/credentials
  state: ~/.hydraflow/credential-state
  backup_token: r2-token
  backoff:
  - 1m
  - 5m
  - 15m
  - 1h
  recheck:
    after: 1h
    every: 30m
    weekly_from: 24h
executor:
  retries: 3
  stage_timeout_seconds: 5400
  stage_seconds_per_added_bead: 600
  self_review_timeout_seconds: 1800
  fanout_max: 4
  batch_width: 4
  tests: host
  tests_heavy: github_actions
  ci: github_actions
  print_stages: docker
  host_path:
  - claude
  - node
  - git
  - uv
  - python3
  - bash
  - sh
  - make
  - bd
  - gh
gate_polarity:
  permissive_when_true:
  - batch.legacy_ready
  - stage_fallbacks.review.allow_same_family
  - lanes.review.allow_same_family
  permissive_when_raised:
  - batch.size
  - batch.closure_limit
  - ratify.unattended.prints.cap
  permissive_when_grown:
  - sandbox.allowed_tools
  - ratify.unattended.prints.reach
  permissive_when_ranked:
    sandbox.harness_sandbox.codex.container:
    - read-only
    - workspace-write
    - danger-full-access
    sandbox.harness_sandbox.codex.host:
    - read-only
    - workspace-write
    - danger-full-access
    sandbox.harness_sandbox.claude.container:
    - enabled
    - disabled
    sandbox.harness_sandbox.claude.host:
    - enabled
    - disabled
