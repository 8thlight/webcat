# This line's policy.yaml, derived by hydraflow init from the kernel's own (printer.line_kit):
# the kernel's declaration with every path into the factory's own tree left out.
# hydraflow upgrade derives it again from the installed kernel and refuses to
# overwrite a copy the line has edited.
schema_version: 1
human:
  default: self_approve
  classes:
  - id: mandate
    approver: review_loop
    merges_only_after_review: true
    paths:
    - .hydraflow/charter.yaml
    - .hydraflow/policy.yaml
    - .hydraflow/loops.yaml
    - .hydraflow/council.yaml
    - .hydraflow/targets.yaml
    - .hydraflow/operator-channel.yaml
    - .hydraflow/escapes.yaml
    - .hydraflow/alarms.yaml
    - .hydraflow/definition-of-ready.yaml
    - .hydraflow/flow-tunables.yaml
    - .hydraflow/knowledge.yaml
    - .hydraflow/learning.yaml
    - .hydraflow/prices.yaml
    - .hydraflow/prices.lock.json
    - .hydraflow/milestones.yaml
    - .hydraflow/product-standards/**
    - .hydraflow/sop-authority.yaml
    - deploy/plant-manager/plant-manager.yaml
    - .hydraflow/floor-filters.yaml
    - .hydraflow/layout.yaml
    - '**/*_reddens.py'
    - agents/**
    - stages/*.yaml
    - agents/operator/**
    - CODEOWNERS
  - id: spec_gate
    stage: spec
    approver: review_loop
research:
  required_for:
  - class:feature
  - class:mandate
locks:
  reproducing_tests_are_read_only:
    applies_to:
    - class:fix
    source: triage.md:reproduces
    stages: all
    escape: a genuinely wrong test is a class:feature print against it, ratified with the reasoning
merge_gate:
  default: review
  pr_body_lists_mandate_paths: true
  loosening_requires: review_loop
  never_retires_for:
  - mandate
  review: human
  landing: train
  direct_within: 2
  batch_branch_send:
    fewest_beads: 15
    most_beads: 20
    longest_wait_hours: 24
  factory_changes_unadopted: 1
  batch_send_reading_holds_minutes: 30
  deps_land: true
  promotion_lands: true
  merge_back_lands: true
  landing_order:
  - red_base_fix
  - depended_on
  - enforcement
  - priority
  - age
  landing_bounds:
    resolve: 30m
    checks: 65m
    age_cap: 90m
    queue_wait: 3h
    reproofs: 2
    reruns: 2
    unread: 3
  train:
    size: 6
    cadence: 45m
    full_after: 15m
    stall_after_windows: 3
    tracks: 2
    judge_outrun: true
    repair_within: 24h
  landing_slos:
    landed_per_day: 4
    queue_to_land: 24h
    since_last_landing: 4h
    release_behind: 24h
fix_rounds:
  max: 5
  stop_when:
    findings_drop_below: 1
    or_rounds_without_new_class: 2
review_tiers:
  anthropic:
  - claude-fable-5-1
  - claude-opus-5-5
  - claude-sonnet-5
  - claude-haiku-4-5-20251001
review_rounds:
  bakes_in:
  - P0
  p0_fix_rounds: 2
verify_rounds:
  max: 3
verify_whole_suite:
  margin: 1.5
  measurements: 5
  refactor_after_seconds: 1200
  slim_set:
    smoke: []
    coverage_map:
      path: var/coverage-map/map.json.gz
      max_behind: 60
scope:
  always_touchable: []
  sittings: []
observability:
  langfuse: metadata
  langfuse_spans_per_day: 1000
  langfuse_units_per_month: 50000
  langfuse_alert_percent: 70
fail_forward:
  mode: skill
  max_per_print: 10
  timeout_seconds: 1200
  max_follow_ups: 5
  plan_rounds_max: 3
  ask_abandonments_max: 3
  workflow_max_agents: 4
  workflow_max_tokens: 50000000
  workflow_runs_per_site: 2
  max_sessions_per_day: 150
  max_concurrent_sessions: 3
  alert_min_consultations: 4
  alert_fallback_share_percent: 50
  alert_bound_breaches: 3
  alert_cost_per_site_usd: 50
  landing_window_days: 14
  landing_floor_percent: 50
  landing_min_prints: 4
  trivial_max_touches: 2
  trivial_refuses_under:
  - migrations/
  - .github/
  take_back_after_seconds: 60
  take_back_at_most_seconds: 3600
  apply_migrations: true
printer_doctor:
  stall_after_minutes: 20
  crash_loop_boots: 3
  crash_loop_within_minutes: 30
stage_picks:
  max: 3
stage_without_a_model:
  max: 3
ratify:
  approver: review_loop
  lanes_by_class:
    default:
      routing: build
      key: worker
    mandate:
      routing: review
      key: review
  unattended:
    prints:
      cap: 100.0
      reach:
      - staging
  widen:
    reach:
    - staging
    - production
rollback:
  approver: operator
shared_revert:
  half_merged_after: 24h
defect_route:
  exhausted_requires: operator
brake:
  conditions:
    secret_in_stream: operator
    destructive_command: operator
    spend_over_cap: operator
interventions:
  outcomes:
    retry: noise
    policy_change: promote
    structural: structural
questions:
  standing_answers: []
caretaker:
  reject_mark_lasts: 720h
question_deadline:
  after_seconds: 43200
  remind_at_percent:
  - 10
  - 50
  - 90
follow_ups:
  holds_through_priority: 1
intake:
  bundle:
    mode: lanes
    min_beads: 15
    max_beads: 20
  approved_work:
    approval_label: approved
    auto_approved_priority: 0
  refinement:
    depth_beyond_slots: 5
    drafts: 3
session:
  ttl: 1h
plant_keys:
  plant-manager:
    key_lane: plant-manager
    persona: plant-manager
    print_id: plant-manager
    stage: shift
    routing: build
    cap_usd: 2.0
    ttl: 1h
  plant-engineer:
    key_lane: plant-engineer
    persona: plant-engineer
    print_id: plant-engineer
    stage: round
    routing: build
    cap_usd: 2.0
    ttl: 1h
console:
  roles:
    operator:
    - intake.link.mint
    - line.start
    - line.stop
    - line.add
    - print.ratify
    - chat.ask
    - bead.create
    - bead.edit
    - bead.dep
    - bead.close
    - bead.archive
    - bead.attach
    - bead.delete
    - decision.resolve
    - decision.feedback
    - source.connect
    - digest.seen
    - question.answer
    - github.sign_in
    - line.go
    - settings.machine
    - print.resume
    - print.retire
    - line.init
    submitter:
    - intake.submit_one
    - intake.comment_own
  grants:
    store: .hydraflow-local/console
    ttl: 168h
    session_ttl: 12h
  chat:
    max_read_rounds: 3
    max_proposals: 3
  links:
    ttl: 72h
    max_bytes: 16384
  refusals:
    window: 10m
  initiatives:
    stall_after: 24h
  digest:
    first_visit: 24h
  switches:
    decision.feedback: true
    bead.create: true
    bead.edit: true
    bead.dep: true
    bead.close: true
    decision.resolve: true
    bead.archive: true
    bead.delete: true
    bead.attach: true
    line.init: true
    source.connect: true
    print.resume: false
    print.retire: false
  hosts:
  - 127.0.0.1
  - localhost
power:
  drain_timeout: 2m
  caretaker_drain_timeout: 1m
  bridge_answer_timeout: 10s
  requires:
  - git
  - gh
  - bd
  - uv
  - make
  on_start:
  - read_declarations
  - reconcile_prints
  - pause_interrupted
  - reap_orphans
  - start_loops
  resume_from: last_committed_artifact
ledger:
  statement_timeout: 30s
  idle_in_transaction_timeout: 1m
  link_down_page_after: 5m
budgets:
  day: 1000.0
  print: 120.0
  line: 1000.0
  overflow_arms_at: 0.75
capacity:
  job_loses_its_slot_for:
  - printer_fault
  - retries_exhausted
  - budget_exhausted
  agents: 6
  slots: 3
  host_stages: 6
  base_red_fix_slots: 1
  host:
    cores: 16
    memory_gb: 30
    stage_memory_gb: 4
    load_per_core: 1.5
  disk:
    held_ceiling_gb: 50
    free_floor_gb: 10
    build_cache_gb: 8
    dangling_images_gb: 2
    pytest_cache_idle_hours: 6
    collection_pass_minutes: 10
